name: Sincronizar Odoo

on:
  schedule:
    # Antes cada 15 min (96 veces/dia) -- eso solo ya casi agotaba el limite
    # de 100 despliegues/dia del plan gratis de Vercel, sin dejar margen para
    # publicar cambios nuestros. Ahora cada 30 min (48 veces/dia).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Traer datos reales de Odoo
        run: npm run sync-odoo
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}

      - name: Publicar datos actualizados
        run: |
          git config user.name "balance-vivo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/datos-ventas.json public/datos-detalle-ventas.json public/datos-inventario.json
          git diff --cached --quiet || git commit -m "Actualizar datos de Odoo"
          git push
