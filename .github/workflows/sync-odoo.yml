name: Sincronizar Odoo

on:
  schedule:
    # Cada 30 min, pero SOLO en horario de tienda (9am-11:30pm hora Colombia,
    # UTC-5 -> 14:00-04:30 UTC) -- fuera de ese rango no hay ventas, no vale
    # la pena gastar cupo de despliegues de Vercel sincronizando de noche.
    # Los horarios de GitHub Actions son en UTC, por eso "14-23,0-4".
    - cron: "*/30 14-23,0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Traer datos reales de Odoo
        run: npm run sync-odoo
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}

      - name: Publicar datos actualizados
        run: |
          git config user.name "balance-vivo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/datos-ventas.json public/datos-detalle-ventas.json public/datos-inventario.json
          git diff --cached --quiet || git commit -m "Actualizar datos de Odoo"
          git push
